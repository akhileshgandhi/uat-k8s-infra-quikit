apiVersion: apps/v1
kind: Deployment
metadata:
  name: vision-api-deployment
  namespace: quikit
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vision-api
  template:
    metadata:
      labels:
        app: vision-api
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "global-role"
        vault.hashicorp.com/agent-init-first: "true"
        vault.hashicorp.com/agent-inject-secret-config: "secret/data/quikit/auth-service"
        vault.hashicorp.com/agent-inject-template-config: |
          {{- with secret "secret/data/quikit/auth-service" -}}
          {{- range $k, $v := .Data.data }}
          export {{ $k }}="{{ $v }}"
          {{- end }}
          {{- end }}
        vault.hashicorp.com/agent-inject-secret-visionapi-config: "secret/data/quikit/visionapi"
        vault.hashicorp.com/agent-inject-template-visionapi-config: |
          {{- with secret "secret/data/quikit/visionapi" -}}
          {{- range $k, $v := .Data.data }}
          export {{ $k }}="{{ $v }}"
          {{- end }}
          {{- end }}   
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: vision-api
          image: ghcr.io/akhileshgandhi/quikvision-api-runtime:uat-m51
         
          command:
            - /bin/sh
            - -c
            - |
              set -e
              set -a
              . /vault/secrets/config
              . /vault/secrets/visionapi-config
              set +a
              cd /app
              exec uvicorn main:app --host 0.0.0.0 --port 8011

          ports:
            - containerPort: 8011
          envFrom:
            - configMapRef:
                name: quikit-config
          env:
            - name: NEXTAUTH_URL
              value: "https://backenduatvision.quikit.ai"   
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8011
            initialDelaySeconds: 45
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8011
            initialDelaySeconds: 15
            periodSeconds: 10