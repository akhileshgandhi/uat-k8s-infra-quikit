apiVersion: apps/v1
kind: Deployment
metadata:
  name: quikconstruction-deployment
  namespace: quikit
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: quikconstruction
  template:
    metadata:
      labels:
        app: quikconstruction
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "global-role"
        vault.hashicorp.com/agent-init-first: "true"
        vault.hashicorp.com/agent-inject-secret-config: "secret/data/quikit/auth-service"
        vault.hashicorp.com/agent-inject-template-config: |
          {{- with secret "secret/data/quikit/auth-service" -}}
          {{- range $k, $v := .Data.data }}
          export {{ $k }}="{{ $v }}"
          {{- end }}
          {{- end }}
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: quikconstruction
          image: ghcr.io/akhileshgandhi/quikinfra-runtime:sha-5ca0a59
          command:
            - /bin/sh
            - -c
            - |
              set -a
              . /vault/secrets/config
              set +a
              cd /app/apps/quikinfra
              exec node server.js
          ports:
            - containerPort: 3006
          envFrom:
            - configMapRef:
                name: quikit-config
          env:
            - name: NEXTAUTH_URL
              value: "https://uatinfra.quikit.ai"
            - name: NEXT_PUBLIC_AUTH_URL
              value: "https://uatauthn.quikit.ai"
            - name: QUIKIT_URL
              value: "https://uatapps.quikit.ai"
            - name: NEXT_PUBLIC_LAUNCHER_URL
              value: "https://uatapps.quikit.ai"
            - name: NEXT_PUBLIC_QUIKINFRA_URL
              value: "https://uatinfra.quikit.ai"
            - name: QUIKIT_CLIENT_ID
              value: "quikinfra"
            - name: PORT
              value: "3006"
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3006
            initialDelaySeconds: 45
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3006
            initialDelaySeconds: 15
            periodSeconds: 10
