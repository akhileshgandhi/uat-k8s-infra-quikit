apiVersion: apps/v1
kind: Deployment
metadata:
  name: flow-deployment
  namespace: quikit
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flow
  template:
    metadata:
      labels:
        app: flow
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "global-role"
        vault.hashicorp.com/agent-init-first: "true"
        vault.hashicorp.com/agent-inject-secret-auth-config: "secret/data/quikit/auth-service"
        vault.hashicorp.com/agent-inject-template-auth-config: |
          {{- with secret "secret/data/quikit/auth-service" -}}
          {{- range $k, $v := .Data.data }}
          export {{ $k }}="{{ $v }}"
          {{- end }}
          {{- end }}
        vault.hashicorp.com/agent-inject-secret-flow-config: "secret/data/quikit/flow"
        vault.hashicorp.com/agent-inject-template-flow-config: |
          {{- with secret "secret/data/quikit/flow" -}}
          {{- range $k, $v := .Data.data }}
          export {{ $k }}="{{ $v }}"
          {{- end }}
          {{- end }}
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: flow
          image: ghcr.io/akhileshgandhi/quikflow-runtime:sha-4657aef
          command:
            - /bin/sh
            - -c
            - |
              set -a
                  . /vault/secrets/auth-config
                  . /vault/secrets/flow-config
                  set +a
              cd /app/apps/quikflow
              exec node server.js
          ports:
            - containerPort: 3014
          envFrom:
            - configMapRef:
                name: quikit-config
          env:
            - name: NEXTAUTH_URL
              value: "https://uatflow.quikit.ai"
            - name: QUIKIT_CLIENT_ID
              value: "quikflow"
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3014
            initialDelaySeconds: 45
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3014
            initialDelaySeconds: 15
            periodSeconds: 10
