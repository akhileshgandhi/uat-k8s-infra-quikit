apiVersion: apps/v1
kind: Deployment
metadata:
  name: quikscale-deployment
  namespace: quikit
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: quikscale
  template:
    metadata:
      labels:
        app: quikscale
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "global-role"
        vault.hashicorp.com/agent-init-first: "true"
        vault.hashicorp.com/agent-inject-secret-config: "secret/data/quikit/auth-service"
        vault.hashicorp.com/agent-inject-template-config: |
          {{- with secret "secret/data/quikit/auth-service" -}}
          {{- range $k, $v := .Data.data }}
          export {{ $k }}="{{ $v }}"
          {{- end }}
          {{- end }}
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: quikscale
          image: ghcr.io/akhileshgandhi/quikscale-runtime:sha-81835f0
          command:
            - /bin/sh
            - -c
            - |
              set -a
              . /vault/secrets/config
              set +a
              cd /app/apps/quikscale
              exec node server.js
          ports:
            - containerPort: 3003
          # quikscale's email module reads EMAIL_USER / EMAIL_PASSWORD_B64
          # (outlier from the SMTP_* convention used by every other app).
          # Both come from quikit-secrets.
          envFrom:
            - configMapRef:
                name: quikit-config
          env:
            - name: NEXTAUTH_URL
              value: "https://uatscale.quikit.ai"
            # - name: NEXT_PUBLIC_QUIKSCALE_URL
            #   value: "https://scale.quikit.ai"
            # OAuth sub-app identity.
            - name: QUIKIT_CLIENT_ID
              value: "quikscale"
              # - name: QUIKIT_CLIENT_SECRET
              #   valueFrom:
              #     secretKeyRef:
              #       name: quikit-secrets
              #       key: QUIKSCALE_CLIENT_SECRET
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3003
            initialDelaySeconds: 45
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3003
            initialDelaySeconds: 15
            periodSeconds: 10
