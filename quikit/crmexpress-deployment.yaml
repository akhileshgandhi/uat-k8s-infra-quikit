apiVersion: apps/v1
kind: Deployment
metadata:
  name: crmexpress-deployment
  namespace: quikit
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: crmexpress
  template:
    metadata:
      labels:
        app: crmexpress
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "global-role"
        vault.hashicorp.com/agent-init-first: "true"
        vault.hashicorp.com/agent-inject-secret-config: "secret/data/quikit/auth-service"
        vault.hashicorp.com/agent-inject-template-config: "{{- with secret \"secret/data/quikit/auth-service\" -}}\n{{- range $k, $v := .Data.data }}\nexport {{ $k }}=\"{{ $v }}\"\n{{- end }}\n{{- end }} \n"
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: crmexpress
          image: ghcr.io/akhileshgandhi/quikcrmexpress-runtime:sha-4657aef
          command:
            - /bin/sh
            - -c
            - |
              set -a
              . /vault/secrets/config
              set +a
              cd /app/apps/quikcrmexpress
              exec node server.js
          ports:
            - containerPort: 3017
          envFrom:
            - configMapRef:
                name: quikit-config
          env:
            - name: NEXTAUTH_URL
              value: "https://uatcrmexpress.quikit.ai"
            - name: QUIKIT_CLIENT_ID
              value: "quikcrmexpress"
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3017
            initialDelaySeconds: 45
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3017
            initialDelaySeconds: 15
            periodSeconds: 10
