apiVersion: apps/v1
kind: Deployment
metadata:
  name: insights-deployment
  namespace: quikit
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: insights
  template:
    metadata:
      labels:
        app: insights
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "global-role"
        vault.hashicorp.com/agent-init-first: "true"
        # This creates /vault/secrets/auth-config
        vault.hashicorp.com/agent-inject-secret-auth-config: "secret/data/quikit/auth-service"
        vault.hashicorp.com/agent-inject-template-auth-config: |
          {{- with secret "secret/data/quikit/auth-service" -}}
          {{- range $k, $v := .Data.data }}
          export {{ $k }}="{{ $v }}"
          {{- end }}
          {{- end }}
        # This creates /vault/secrets/insights-config
        vault.hashicorp.com/agent-inject-secret-insights-config: "secret/data/quikit/insights"
        vault.hashicorp.com/agent-inject-template-insights-config: |
          {{- with secret "secret/data/quikit/insights" -}}
          {{- range $k, $v := .Data.data }}
          export {{ $k }}="{{ $v }}"
          {{- end }}
          {{- end }}
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: insights
          image: ghcr.io/akhileshgandhi/quikinsight-runtime:sha-f6b3023
          command:
            - /bin/sh
            - -c
            - |
              set -a
              . /vault/secrets/auth-config
              . /vault/secrets/insights-config
              set +a

              cd /app/apps/quikinsight
              exec node server.js
          ports:
            - containerPort: 3015
          envFrom:
            - configMapRef:
                name: quikit-config
          env:
            - name: NEXTAUTH_URL
              value: "https://uatinsights.quikit.ai"
            - name: QUIKIT_CLIENT_ID
              value: "insights"
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3015
            initialDelaySeconds: 45
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3015
            initialDelaySeconds: 15
            periodSeconds: 10
