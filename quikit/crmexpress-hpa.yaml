apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: crmexpress-hpa
  namespace: quikit
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: crmexpress-deployment
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
