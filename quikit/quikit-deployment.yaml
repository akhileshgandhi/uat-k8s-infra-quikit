apiVersion: apps/v1
kind: Deployment
metadata:
  name: quikit-deployment
  namespace: quikit
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: quikit
  template:
    metadata:
      labels:
        app: quikit
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "global-role"
        vault.hashicorp.com/agent-init-first: "true"
        vault.hashicorp.com/agent-inject-secret-config: "secret/data/quikit/auth-service"
        vault.hashicorp.com/agent-inject-template-config: |
          {{- with secret "secret/data/quikit/auth-service" -}}
          {{- range $k, $v := .Data.data }}
          export {{ $k }}="{{ $v }}"
          {{- end }}
          {{- end }}
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: quikit
          image: ghcr.io/akhileshgandhi/quikit-runtime:sha-3c2433a
          command:
            - /bin/sh
            - -c
            - |
              set -a
              . /vault/secrets/config
              set +a
              cd /app/apps/quikit
              exec node server.js
          ports:
            - containerPort: 3000
          # quikit is the OAuth IdP — needs JWT_SIGNING_KEY[+_PUBLIC], all
          # OAuth provider creds, every sub-app's launcher tile URL, etc.
          # All come from quikit-secrets + quikit-config.
          envFrom:
            - configMapRef:
                name: quikit-config
          # Per-pod value: this pod's own NEXTAUTH_URL (the launcher's host).
          env:
            - name: NEXTAUTH_URL
              value: "https://uatapps.quikit.ai"
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 45
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
