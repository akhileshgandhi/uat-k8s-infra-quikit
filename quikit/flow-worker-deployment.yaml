apiVersion: apps/v1
kind: Deployment
metadata:
  name: flow-worker-deployment
  namespace: quikit
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flow-worker
  template:
    metadata:
      labels:
        app: flow-worker
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "global-role"
        vault.hashicorp.com/agent-init-first: "true"
        vault.hashicorp.com/agent-inject-secret-auth-config: "secret/data/quikit/auth-service"
        vault.hashicorp.com/agent-inject-template-auth-config: |
          {{- with secret "secret/data/quikit/auth-service" -}}
          {{- range $k, $v := .Data.data }}
          export {{ $k }}="{{ $v }}"
          {{- end }}
          {{- end }}
        vault.hashicorp.com/agent-inject-secret-flow-config: "secret/data/quikit/flow"
        vault.hashicorp.com/agent-inject-template-flow-config: |
          {{- with secret "secret/data/quikit/flow" -}}
          {{- range $k, $v := .Data.data }}
          export {{ $k }}="{{ $v }}"
          {{- end }}
          {{- end }}
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: flow-worker
          image: ghcr.io/akhileshgandhi/quikflow-worker-runtime:sha-7590c83
          command:
            - /bin/sh
            - -c
            - |
              set -a
              . /vault/secrets/auth-config
              . /vault/secrets/flow-config
              set +a

              exec node /app/apps/quikflow/dist/worker.js
          envFrom:
            - configMapRef:
                name: quikit-config
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "kill -0 1"
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "kill -0 1"
            initialDelaySeconds: 10
            periodSeconds: 10
