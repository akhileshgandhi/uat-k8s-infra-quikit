apiVersion: apps/v1
kind: Deployment
metadata:
  name: crm-deployment
  namespace: quikit
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: crm
  template:
    metadata:
      labels:
        app: crm
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "global-role"
        vault.hashicorp.com/agent-init-first: "true"
        vault.hashicorp.com/agent-inject-secret-config: "secret/data/quikit/auth-service"
        vault.hashicorp.com/agent-inject-template-config: |
          {{- with secret "secret/data/quikit/auth-service" -}}
          {{- range $k, $v := .Data.data }}
          export {{ $k }}="{{ $v }}"
          {{- end }}
          {{- end }}
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: crm
          image: ghcr.io/akhileshgandhi/quikcrm-runtime:sha-5443854
          command:
            - /bin/sh
            - -c
            - |
              set -a
              . /vault/secrets/config
              set +a
              cd /app/apps/quikcrm
              exec node server.js
          ports:
            - containerPort: 3008
          # Cluster-wide envs (DATABASE_URL, NEXTAUTH_SECRET, SMTP_*, OAuth
          # creds, AUTH_CORS_ORIGINS, JWT_*, NEXT_PUBLIC_* shared URLs)
          # come from quikit-secrets + quikit-config.
          envFrom:
            - configMapRef:
                name: quikit-config
          # Per-pod values (this pod's own NEXTAUTH_URL).
          env:
            - name: NEXTAUTH_URL
              value: "https://uatcrm.quikit.ai"
            - name: NEXT_PUBLIC_QUIKCRM_URL
              value: "https://uatcrm.quikit.ai"
            - name: CRON_SECRET
              value: "aaja"
              # - name: JWT_SECRET
              #   value: "7ynQaE7hcVrogq9q7OdIQTnCaeg+uPLeqXELLAWQ7LE="
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3008
            initialDelaySeconds: 90
            timeoutSeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3008
            initialDelaySeconds: 30
            timeoutSeconds: 5
            periodSeconds: 15
