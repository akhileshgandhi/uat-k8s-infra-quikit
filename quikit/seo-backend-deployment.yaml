apiVersion: apps/v1
kind: Deployment
metadata:
  name: seo-backend-deployment
  namespace: quikit
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seo-backend
  template:
    metadata:
      labels:
        app: seo-backend
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "global-role"
        vault.hashicorp.com/agent-init-first: "true"
        vault.hashicorp.com/agent-inject-secret-config: "secret/data/quikit/auth-service"
        vault.hashicorp.com/agent-inject-template-config: |
          {{- with secret "secret/data/quikit/auth-service" -}}
          {{- range $k, $v := .Data.data }}
          export {{ $k }}="{{ $v }}"
          {{- end }}
          {{- end }}
        vault.hashicorp.com/agent-inject-secret-seo-backend: "secret/data/quikit/seo-backend"
        vault.hashicorp.com/agent-inject-template-seo-backend: |
          {{- with secret "secret/data/quikit/seo-backend" -}}
          {{- range $k, $v := .Data.data }}
          export {{ $k }}="{{ $v }}"
          {{- end }}
          {{- end }}
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: seo-backend
          image: ghcr.io/akhileshgandhi/quikseo-api-runtime:uat-m63
          command:
            - /bin/sh
            - -c
            - |
              set -a
              . /vault/secrets/config
              . /vault/secrets/seo-backend
              set +a
              cd /app/apps/quikseo-backend
              exec uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8029} --proxy-headers --forwarded-allow-ips='*'
          ports:
            - containerPort: 8029
          envFrom:
            - configMapRef:
                name: quikit-config
          env:
            - name: NEXTAUTH_URL
              value: "https://uatseoapi.quikit.ai"
            - name: QUIKIT_CLIENT_ID
              value: "quikseo-backend"
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8029
            initialDelaySeconds: 45
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8029
            initialDelaySeconds: 15
            periodSeconds: 10
