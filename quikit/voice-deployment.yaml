apiVersion: apps/v1
kind: Deployment
metadata:
  name: voice-deployment
  namespace: quikit
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: voice
  template:
    metadata:
      labels:
        app: voice
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "global-role"
        vault.hashicorp.com/agent-init-first: "true"
        vault.hashicorp.com/agent-inject-secret-config: "secret/data/quikit/auth-service"
        vault.hashicorp.com/agent-inject-template-config: |
          {{- with secret "secret/data/quikit/auth-service" -}}
          {{- range $k, $v := .Data.data }}
          export {{ $k }}="{{ $v }}"
          {{- end }}
          {{- end }}
        vault.hashicorp.com/agent-inject-secret-voice-app: "secret/data/quikit/voice-app"
        vault.hashicorp.com/agent-inject-template-voice-app: |
          {{- with secret "secret/data/quikit/voice-app" -}}
          {{- range $k, $v := .Data.data }}
          export {{ $k }}="{{ $v }}"
          {{- end }}
          {{- end }}  
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: voice
          image: ghcr.io/akhileshgandhi/quikvoice-runtime:uat-m53
          command:
            - /bin/sh
            - -c
            - |
              set -a
              . /vault/secrets/config
              . /vault/secrets/voice-app
              set +a
              cd /app/apps/quikvoice
              exec node server.js
          ports:
            - containerPort: 3036
          envFrom:
            - configMapRef:
                name: quikit-config
          env:
            - name: NEXTAUTH_URL
              value: "https://uatvoice.quikit.ai"
            - name: QUIKIT_CLIENT_ID
              value: "quikvoice"
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3036
            initialDelaySeconds: 45
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3036
            initialDelaySeconds: 15
            periodSeconds: 10
