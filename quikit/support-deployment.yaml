apiVersion: apps/v1
kind: Deployment
metadata:
  name: support-deployment
  namespace: quikit
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: support
  template:
    metadata:
      labels:
        app: support
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "global-role"
        vault.hashicorp.com/agent-init-first: "true"
        vault.hashicorp.com/agent-inject-secret-config: "secret/data/quikit/auth-service"
        vault.hashicorp.com/agent-inject-template-config: |
          {{- with secret "secret/data/quikit/auth-service" -}}
          {{- range $k, $v := .Data.data }}
          export {{ $k }}="{{ $v }}"
          {{- end }}
          {{- end }}
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: support
          image: ghcr.io/akhileshgandhi/quiksupport-runtime:sha-593bac0
          command:
            - /bin/sh
            - -c
            - |
              set -a
              . /vault/secrets/config
              set +a
              cd /app/apps/quiksupport
              exec node server.js
          ports:
            - containerPort: 3010
          # AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY come from
          # quikit-secrets; AWS_REGION + AWS_S3_BUCKET come from
          # quikit-config (non-secret).
          envFrom:
            - configMapRef:
                name: quikit-config
          env:
            - name: NEXTAUTH_URL
              value: "https://uatsupport.quikit.ai"
            - name: NEXT_PUBLIC_QUIKSUPPORT_URL
              value: "https://uatsupport.quikit.ai"
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3010
            initialDelaySeconds: 45
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3010
            initialDelaySeconds: 15
            periodSeconds: 10
