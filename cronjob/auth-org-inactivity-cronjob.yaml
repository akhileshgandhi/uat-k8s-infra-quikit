
apiVersion: batch/v1
kind: CronJob
metadata:
  name: auth-org-inactivity
  namespace: quikit
spec:
  # Run every day at 03:00 IST
  schedule: "0 3 * * *"
  timeZone: "Asia/Kolkata"

  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 10800
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

  jobTemplate:
    spec:
      activeDeadlineSeconds: 900
      backoffLimit: 1

      template:
        spec:
          restartPolicy: Never

          containers:
            - name: trigger
              image: curlimages/curl:8.10.1

              args:
                - "--silent"
                - "--show-error"
                - "--fail-with-body"
                - "--max-time"
                - "600"
                - "--retry"
                - "2"
                - "--retry-delay"
                - "30"
                - "--retry-connrefused"
                - "-X"
                - "POST"
                - "--data"
                - ""
                - "-H"
                - "Authorization: Bearer $(CRON_SECRET)"
                - "https://uatauthn.quikit.ai/api/internal/org-inactivity/daily"

              env:
                - name: CRON_SECRET
                  value: "quikit"

              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi

              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                capabilities:
                  drop:
                    - ALL
