apiVersion: batch/v1
kind: CronJob
metadata:
  name: hrms-recruit-daily-report
  namespace: quikit
  labels:
    app: hrms
    component: recruit-daily-report

spec:
  # Run every day at 8:00 PM IST
  schedule: "0 20 * * *"
  timeZone: "Asia/Kolkata"

  # Never allow two report runs at the same time
  concurrencyPolicy: Forbid

  # If Kubernetes misses the scheduled time, only run within 2 minutes
  startingDeadlineSeconds: 120

  # Keep the last few Jobs for troubleshooting
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

  jobTemplate:
    spec:
      # Retry the Job once if it fails
      backoffLimit: 1

      # Stop the Job after 2 minutes
      activeDeadlineSeconds: 120

      template:
        metadata:
          labels:
            app: hrms
            component: recruit-daily-report

        spec:
          restartPolicy: Never

          containers:
            - name: trigger
              image: curlimages/curl:8.10.1

              env:
                - name: CRON_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: hrms-secrets
                      key: CRON_SECRET

                # UAT HRMS recruitment report endpoint
                - name: TARGET_URL
                  value: "https://uatpeople.quikit.ai/api/v1/hrms/cron/recruit-daily-report"

              command:
                - /bin/sh
                - -c
                - |
                  set -eu

                  echo "Starting HRMS recruitment daily report..."

                  curl --fail-with-body \
                       --silent \
                       --show-error \
                       --max-time 60 \
                       --retry 2 \
                       --retry-delay 10 \
                       --retry-connrefused \
                       -H "Authorization: Bearer ${CRON_SECRET}" \
                       "${TARGET_URL}"

                  echo
                  echo "HRMS recruitment report completed successfully."

              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi

              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 100
                runAsGroup: 101
                capabilities:
                  drop:
                    - ALL