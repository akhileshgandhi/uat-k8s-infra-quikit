apiVersion: apps/v1
kind: Deployment
metadata:
  name: visionempregistration-deployment
  namespace: quikit
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: visionempregistration
  template:
    metadata:
      labels:
        app: visionempregistration
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "global-role"
        vault.hashicorp.com/agent-init-first: "true"
        vault.hashicorp.com/agent-inject-secret-config: "secret/data/quikit/visionemp"
        vault.hashicorp.com/agent-inject-template-config: |
          {{- with secret "secret/data/quikit/visionemp" -}}
          {{- range $k, $v := .Data.data }}
          export {{ $k }}="{{ $v }}"
          {{- end }}
          {{- end }} 

    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
      - name: visionempregistration
        image: ghcr.io/akhileshgandhi/visionempregistration-runtime:v1

        command:
        - /bin/sh
        - -c
        - |
          set -a
          . /vault/secrets/config
          set +a
          cd /app/apps/visionempregistration
          exec node server.js

        ports:
        - containerPort: 7010

        envFrom:
        - configMapRef:
            name: quikit-config
        
        env:
          - name: NEXTAUTH_URL
            value: "https://uatvisionempregistration.quikit.ai"
          - name: QUIKIT_CLIENT_ID
            value: "visionempregistration"

        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "256Mi"

        livenessProbe:
          httpGet:
            path: /api/health
            port: 7010
          initialDelaySeconds: 45
          periodSeconds: 20

        readinessProbe:
          httpGet:
            path: /api/health
            port: 7010
          initialDelaySeconds: 15
          periodSeconds: 10
